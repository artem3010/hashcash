version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - "POW_SERVER_HOST=server"
      - "POW_SERVER_PORT=8080"
    ports:
      - "8081:8081"
    restart: unless-stopped
